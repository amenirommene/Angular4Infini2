<div class="list-suggestion-container">
  <h1 class="page-title">{{ titre }} </h1>   <button class="btn-favorite" [routerLink]="['add']">Ajouter un suggestion</button>

  <div class="search-container">
    <input
      type="text"
      class="search-input"
      [placeholder]="placeHolderText"
      [(ngModel)]="serachT"
  />
  </div>

  <div class="suggestions-list">
    <div *ngFor="let s of suggestions">
    <div class="suggestion-card" *ngIf="s.title.toLocaleLowerCase().includes(serachT.toLowerCase())" >
      <div class="card-header">
        <h2 class="suggestion-title">{{s.title}}</h2>
      </div>

      <div class="card-meta">
        <span class="category">{{s.category}}</span>
        <span class="date">{{s.date | date: "dd MMM yyyy"}}</span>
      </div>

      <p class="suggestion-description">{{s.description}}</p>

      <div class="card-footer">
      <span class="status-badge"
      [ngClass]="
        {'status-accepted' : s.status == 'acceptee','status-refused' : s.status == 'refusee', 'status-pending' : s.status == 'en_attente' }">
        {{s.status | uppercase}}
      </span>

        <div  class="action-buttons">
          <button class="btn-like" *ngIf="s.status != 'refusee'" (click)="like(s)">
            <span class="icon">👍</span>
           {{s?.nbLikes}}
          </button>
          <button class="btn-favorite"
          [disabled]="s.status == 'refusee'" (click)="addToFavoris(s)">
            <span class="icon">❤️</span>
            Ajouter aux favoris
          </button>
          <button class="btn-favorite" [routerLink]="['./',s.id]">
            Details
          </button>
        </div>
      </div>
    </div>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
